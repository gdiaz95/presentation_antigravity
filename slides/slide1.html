<!DOCTYPE html>
<html>
<head>
<style>
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #181B24; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
}
.content {
  width: 560pt;
  padding: 40pt; 
  background: #222633; 
  border-left: 16pt solid #B165FB;
  border-bottom: 8pt solid #40695B;
  box-shadow: 4px 4px 15px rgba(0, 0, 0, 0.4);
  display: flex; flex-direction: column; align-items: center;
}
h1 { color: #FFFFFF; font-size: 46pt; margin: 0 0 15pt 0; text-align: center; }
p { color: #E0E0E0; font-size: 24pt; margin: 0; text-align: center; }
.accent-line {
  background: #B165FB;
  width: 100pt;
  height: 4pt;
  margin: 15pt 0;
}
</style>
</head>
<body>
<div class="content">
  <h1>Quantum Computing</h1>
  <div class="accent-line"></div>
  <p>A Beginner's Guide to the Future</p>
</div>
</body>
</html>
