<!DOCTYPE html>
<html>
<head>
<style>
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: 'Segoe UI', Arial, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  box-sizing: border-box;
}
.title-container {
  margin-top: 30pt;
  width: 600pt;
  text-align: center;
}
h1 {
  color: #000000; font-size: 26pt; font-weight: bold; 
  margin: 0; text-decoration: underline; line-height: 1.2;
}
.images-container {
  display: flex; flex-direction: row; justify-content: center; align-items: center;
  gap: 50pt;
  margin-top: 20pt;
}
.hero-image {
  height: 180pt; object-fit: contain;
}
.subtitle-container {
  margin-top: 20pt;
  text-align: center;
}
.perspective-text {
  color: #000000; font-size: 20pt; font-style: italic; font-weight: bold; margin: 0 0 10pt 0;
}
.author-text {
  color: #000000; font-size: 22pt; font-weight: bold; text-decoration: underline; margin: 0;
}
.footer-container {
  width: 100%;
  display: flex; justify-content: space-between;
  padding: 0 20pt 10pt 20pt;
  box-sizing: border-box;
}
.owl-logo {
  width: 40pt; height: auto;
}
</style>
</head>
<body>
  <div class="title-container">
    <h1>Shortest-Path Solutions for Connecting Multiple Terminals via Deep Learning</h1>
  </div>
  
  <div class="images-container">
    <img src="robotmaze.png" class="hero-image" />
    <img src="maze2d.png" class="hero-image" />
  </div>
  
  <div class="subtitle-container">
    <p class="perspective-text">A fresh perspective</p>
    <p class="author-text">Gabriel Díaz Ramos</p>
  </div>
  
  <div class="footer-container">
    <img src="owl.png" class="owl-logo" />
    <img src="owl.png" class="owl-logo" />
  </div>
</body>
</html>
